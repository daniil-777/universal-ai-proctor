name: Test production container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      runner:
        description: Native Linux runner for the production container smoke checks
        type: string
        default: ubuntu-24.04
      smoke_only:
        description: Skip source checks already covered by the main x86 run
        type: boolean
        default: false
      expected_node_arch:
        description: Expected native Node architecture inside the image
        type: string
        default: x64

permissions:
  contents: read

concurrency:
  group: container-test-${{ github.ref }}-${{ inputs.runner || 'ubuntu-24.04' }}
  cancel-in-progress: true

jobs:
  source-checks:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check downloader against local HTTP fixtures
        run: node --test scripts/download-assets.test.mjs
      - name: Install native tools and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          npm ci --include=dev --prefix backend
          npm ci --include=dev --prefix frontend
      - name: Fetch verified runtime test media
        run: node scripts/download-assets.mjs
      - name: Type, lint and unit checks
        env:
          MOCK: "1"
        run: |
          npm run check
          npm test

  container-smoke:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      EXPECTED_NODE_ARCH: ${{ inputs.expected_node_arch || 'x64' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate the Oracle Compose and HTTPS proxy configuration
        run: |
          docker compose --env-file deployment/oracle/.env.example --file deployment/oracle/docker-compose.yml config --quiet
          docker run --rm --env APP_DOMAIN=guide.example.com --env ACME_EMAIL=owner@example.com \
            --mount type=bind,source="$PWD/deployment/oracle/Caddyfile",target=/etc/caddy/Caddyfile,readonly \
            caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9 caddy validate --config /etc/caddy/Caddyfile
      - name: Build the Linux production image
        run: |
          if [ "$EXPECTED_NODE_ARCH" = arm64 ]; then test "$(uname -m)" = aarch64; else test "$(uname -m)" = x86_64; fi
          docker build --pull --tag process-guide:ci .
          if [ "$EXPECTED_NODE_ARCH" = arm64 ]; then expected_image_arch=arm64; else expected_image_arch=amd64; fi
          test "$(docker image inspect process-guide:ci --format '{{.Architecture}}')" = "$expected_image_arch"
      - name: Start a mock-only server on a persistent volume
        run: |
          docker volume create process-guide-ci-data
          docker run --detach --name process-guide --publish 127.0.0.1:8101:8101 \
            --mount source=process-guide-ci-data,target=/data \
            --env MOCK=1 --env ACCOUNT_PUBLIC_ORIGIN=http://localhost:8101 \
            --env ACCOUNT_COOKIE_SECURE=false process-guide:ci
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8101/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs process-guide
          exit 1
      - name: Verify runtime binaries and unprivileged server
        run: |
          docker exec process-guide ffmpeg -version
          docker exec process-guide ffprobe -version
          docker exec --interactive --env EXPECTED_NODE_ARCH="$EXPECTED_NODE_ARCH" process-guide node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          assert.equal(Number(process.versions.node.split('.')[0]), 24);
          assert.equal(process.arch, process.env.EXPECTED_NODE_ARCH);
          const servers = fs.readdirSync('/proc').filter(id => /^\d+$/.test(id)).filter(id => {
            try { const command = fs.readFileSync(`/proc/${id}/cmdline`, 'utf8').split('\0'); return /(?:^|\/)node$/.test(command[0]) && command.includes('dist/server.js'); }
            catch { return false; }
          });
          assert.equal(servers.length, 1);
          const status = fs.readFileSync(`/proc/${servers[0]}/status`, 'utf8');
          assert.equal(/^Uid:\s+(\d+)/m.exec(status)?.[1], '1000');
          console.log(`Native ${process.arch} / Node 24 / FFmpeg / unprivileged app process verified.`);
          JS
      - name: Exercise all samples, real decoding, mock guidance, reports and account save
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          const base = 'http://localhost:8101', session = randomUUID();
          let cookie = '', source = '';
          async function call(route, body, extra = {}) {
            const response = await fetch(base + route, {
              method: body ? 'POST' : 'GET',
              headers: { Origin: base, 'X-Guidance-Session': session, ...(cookie ? {Cookie:cookie} : {}), ...(body ? {'Content-Type':'application/json'} : {}), ...extra },
              ...(body ? {body:JSON.stringify(body)} : {}),
              signal: AbortSignal.timeout(60_000),
            });
            assert.ok(response.ok, `${route}: ${response.status} ${response.ok ? '' : await response.text()}`);
            for (const value of response.headers.getSetCookie()) if (value.startsWith('process-guide-account=')) cookie = value.split(';')[0];
            return response;
          }
          const json = async (route, body) => (await call(route, body)).json();
          const health = await json('/api/health');
          assert.equal(health.mock, true);
          assert.ok(Object.values(health.providers).every(value => value === false));
          assert.ok((await (await call('/')).text()).includes('<html'));
          const samples = await json('/api/samples');
          assert.equal(samples.videos.length, 6);
          assert.ok(samples.documents.some(doc => doc.filename === 'Cholecystectomy.txt'));
          for (const video of samples.videos) {
            source = randomUUID();
            await json('/api/source', {source_id:source, kind:'video', name:video.name});
            const loaded = await json('/api/video/load-sample', {id:video.id, source_id:source});
            assert.equal(loaded.filename, video.guidance);
            assert.ok(loaded.workflow.steps.length > 0);
            assert.ok(loaded.info.duration > 0 && loaded.info.width > 0);
            const range = await call(loaded.stream_url, undefined, {Range:'bytes=0-99'});
            assert.equal(range.status, 206);
            assert.equal((await range.arrayBuffer()).byteLength, 100);
          }
          const observation = await json('/api/guidance/analyze', {source_id:source,current_s:12,n_samples:4});
          assert.ok(observation.used_frames > 0);
          const answer = await json('/api/llm/ask', {source_id:source,current_s:12,question:'What is visible?'});
          assert.match(answer.answer, /demo|provider/i);
          const stream = await (await call('/api/llm/ask/stream', {source_id:source,current_s:12,question:'What should I check?'})).text();
          assert.ok(stream.includes('"done":true') && !stream.includes('"error":'));
          const pdf = Buffer.from(await (await call('/api/review/report.pdf')).arrayBuffer());
          assert.equal(pdf.subarray(0,5).toString(), '%PDF-');
          assert.ok((await (await call('/api/review/report.html')).text()).includes('<html'));
          const zip = Buffer.from(await (await call('/api/dataset')).arrayBuffer());
          assert.equal(zip.subarray(0,2).toString(), 'PK');
          const email = `container-${randomUUID()}@example.com`, password = randomUUID() + '-test';
          await json('/api/account/register', {name:'Container smoke',email,password});
          const review = await json('/api/review');
          const saved = await json('/api/account/training/save', {source_id:review.source_id,reference_key:review.reference_key,review_version:review.review_version,title:'Container persistence check'});
          assert.equal((await json('/api/account/training')).history.length, 1);
          await writeFile('ci-persistence.json', JSON.stringify({email,password,id:saved.id}), {mode:0o600});
          console.log('Six bundled videos/guides, FFmpeg range playback, mocked guidance/Q&A/SSE, PDF/HTML/ZIP and account save passed. Paid AI calls: zero.');
          JS
      - name: Verify uploads, report evidence and account lifecycle
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p evaluation/assets
          docker cp process-guide:/app/evaluation/assets/parts-sorting.mp4 evaluation/assets/parts-sorting.mp4
          node scripts/account-smoke.mjs http://localhost:8101
      - name: Restart and verify durable saved activity
        run: |
          docker restart process-guide
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8101/api/health > /dev/null; then break; fi
            sleep 2
          done
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const state = JSON.parse(await readFile('ci-persistence.json','utf8')), base='http://localhost:8101';
          let cookie='';
          async function call(route,body,method=body?'POST':'GET') {
            const response=await fetch(base+route,{method,headers:{Origin:base,...(cookie?{Cookie:cookie}:{}),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(60_000)});
            assert.ok(response.ok,`${route}: ${response.status}`);
            for(const value of response.headers.getSetCookie()) if(value.startsWith('process-guide-account=')) cookie=value.split(';')[0];
            return response;
          }
          await call('/api/account/login',{email:state.email,password:state.password});
          const history=await (await call('/api/account/training')).json();
          assert.equal(history.history.length,1);
          assert.equal(history.history[0].id,state.id);
          const pdf=Buffer.from(await (await call(`/api/account/training/${state.id}/report.pdf`)).arrayBuffer());
          assert.equal(pdf.subarray(0,5).toString(),'%PDF-');
          await call('/api/account/me',{password:state.password,confirmation:'DELETE'},'DELETE');
          console.log('Account and saved PDF survive restart on the retained SQLite disk.');
          JS
      - name: Verify the private app through the Oracle HTTPS proxy
        run: node deployment/oracle/smoke-proxy.mjs
      - name: Show container logs on failure
        if: failure()
        run: docker logs process-guide || true
      - name: Remove isolated test resources
        if: always()
        run: |
          docker rm --force process-guide || true
          docker volume rm process-guide-ci-data || true
          rm -f ci-persistence.json
